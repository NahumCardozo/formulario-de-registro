<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario de registro</title>
</head>
<body>
    <header id="header">
        <h1>Formulario de registro</h1>
    </header>

    <main id="main">
        <form class="formulario" onsubmit="registro(event)">
            <label for="nombre">Nombre y apellido:</label>
            <input type="text" id="nombre-y-apellido" name="nombre" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="contrasenia">Contraseña:</label>
            <input type="password" id="contrasenia" name="password" required>

            <label for="confirmacion-contrasenia">Confirmar Contraseña:</label>
            <input type="password" id="confirmacion-contrasenia" name="confirm_password" required>

            <button type="submit" id="boton-creacion">Registrar</button>
        </form>
    </main>

    <footer id="footer">
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
